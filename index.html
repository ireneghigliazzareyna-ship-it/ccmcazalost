<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero CCM & Cazalost</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <header class="mb-6 text-center">
    <h1 class="text-3xl font-bold text-gray-800">Tablero de Control: Cazalost - CCM</h1>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-7xl mx-auto">
    <!-- Columna Cazalost -->
    <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-blue-500">
      <h2 class="text-xl font-bold mb-4 text-blue-600">Derivaciones Cazalost ➔ CCM</h2>
      <div id="cazalost-list" class="space-y-3"></div>
    </div>

    <!-- Columna CCM -->
    <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-green-500">
      <h2 class="text-xl font-bold mb-4 text-green-600">Respuestas CCM</h2>
      <div id="ccm-list" class="space-y-3"></div>
    </div>
  </div>

  <script>
    async function cargarDatos() {
      try {
        // Agregamos timestamp para evitar almacenamiento en caché
        const res = await fetch('data.json?t=' + new Date().getTime());
        const data = await res.json();

        // Renderizar columna Cazalost
        const cazalostContainer = document.getElementById('cazalost-list');
        cazalostContainer.innerHTML = (data.cazalost_ccm || []).map(item => `
          <div class="p-3 bg-blue-50 border border-blue-200 rounded-md">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-blue-800">${item.id}</span>
              <span class="text-xs text-gray-500">${item.fecha}</span>
            </div>
            <p class="font-medium text-gray-700">${item.titulo || ''}</p>
            <p class="text-sm text-gray-600">${item.detalle || ''}</p>
            <span class="inline-block mt-2 px-2 py-0.5 text-xs bg-blue-200 text-blue-800 rounded">${item.estado}</span>
          </div>
        `).join('');

        // Renderizar columna CCM
        const ccmContainer = document.getElementById('ccm-list');
        ccmContainer.innerHTML = (data.respuestas_ccm || []).map(item => `
          <div class="p-3 bg-green-50 border border-green-200 rounded-md">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-green-800">${item.id} (Ref: ${item.id_origen})</span>
              <span class="text-xs text-gray-500">${item.fecha}</span>
            </div>
            <p class="text-sm text-gray-700">${item.respuesta || ''}</p>
            <span class="inline-block mt-2 px-2 py-0.5 text-xs bg-green-200 text-green-800 rounded">${item.estado}</span>
          </div>
        `).join('');

      } catch (error) {
        console.error("Error al cargar data.json:", error);
      }
    }

    // Cargar datos al iniciar y consultar actualizaciones cada 10 segundos
    cargarDatos();
    setInterval(cargarDatos, 10000);
  </script>
</body>
</html>
